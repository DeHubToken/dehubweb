<!doctype html>
<html><head><meta charset="utf-8"><title>DeHub Requests ad</title>
<style>
@font-face{font-family:'Exo';src:url(a/exo-500.ttf) format('truetype');font-weight:500}
@font-face{font-family:'Exo';src:url(a/exo-700.ttf) format('truetype');font-weight:700}
@font-face{font-family:'DMono';src:url(a/mono.ttf) format('truetype')}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#000;overflow:hidden}
#stage{position:relative;overflow:hidden;background:#000;color:#fff;font-family:'Exo','Noto Color Emoji',sans-serif;font-weight:500;-webkit-font-smoothing:antialiased}
.ab{position:absolute;left:0;top:0;transform-origin:0 0}
.ac{position:absolute;left:0;top:0;transform-origin:50% 50%}
.fill{position:absolute;inset:0}
.mono{font-family:'DMono',monospace;text-transform:uppercase;letter-spacing:.2em}
svg.i{fill:none;display:block}
.chrome{background:linear-gradient(180deg,#ffffff 0%,#f1f1f1 30%,#9a9a9a 49%,#5e5e5e 51%,#e9e9e9 66%,#bdbdbd 84%,#ffffff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.nowrap{white-space:nowrap}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.1) 50%,rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.3);box-shadow:0 8px 32px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(255,255,255,.1);color:#fff}
/* requests page replica (dehubweb src/pages/app/FeaturesPage.tsx) */
.pgx{font-size:14px;line-height:1.4;color:#fff}
.pgx .bento{background:#18181b;border-radius:16px;padding:24px;margin-bottom:12px}
.pgx .row{display:flex;align-items:center}
.pgx .gbtn{display:inline-flex;align-items:center;gap:8px;border-radius:12px;padding:0 14px;height:36px;font-size:14px;font-weight:700}
.pgx .card{position:relative;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.03);padding:12px}
.pgx .av{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.pgx .pill{font-size:10px;font-weight:500;padding:2px 8px;border-radius:8px;border:1px solid;white-space:nowrap;display:inline-block}
.pgx .cat{color:#d4d4d8;background:linear-gradient(135deg,rgba(255,255,255,.15),rgba(255,255,255,.08),rgba(255,255,255,.03));border-color:rgba(255,255,255,.2);box-shadow:0 2px 8px rgba(0,0,0,.15),inset 0 1px 0 rgba(255,255,255,.3)}
.pgx .act{display:flex;align-items:center;gap:22px;color:#a1a1aa;font-size:13px;margin-top:10px}
.pgx .act span{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.pgx .tab{position:relative;z-index:1;flex:1;height:36px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;color:#71717a}
.pgx .cnt{font-size:10px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.7);padding:2px 6px;border-radius:6px;font-weight:700;font-variant-numeric:tabular-nums}
</style></head>
<body><div id="stage"></div>
<script src="film.js"></script>
</body></html>
