<!doctype html>
<html lang="en" data-theme="system" data-screen="feed">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=375, initial-scale=1">
<title>DeHub phone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo:wght@400;500;600;700&display=swap">
<style>
/* ---------------------------------------------------------------------------
   One phone screen, 375 x 812, themed exactly like dehub.io at phone width.
   Values below were read off the live site (computed styles) per theme.
   --------------------------------------------------------------------------- */
:root{
  --page:#000; --ink:#fff; --mute:rgb(128,128,137); --icon:#fff; --tab-ink:rgb(161,161,170); --tab-on:#fff;
  --hdr:#000; --strip:#000;
  --pill-bg:rgba(9,9,11,.4); --pill-img:none; --pill-sh:inset 0 0 0 1px rgba(255,255,255,.08),0 8px 32px rgba(0,0,0,.3); --pill-r:12px; --pill-blur:blur(20px) saturate(1.6);
  --on-bg:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.06)); --on-sh:inset 0 0 0 1px rgba(255,255,255,.16),0 2px 8px rgba(0,0,0,.4); --on-r:12px;
  --card-bg:rgba(255,255,255,.03); --card-img:none; --card-bd:.8px solid rgba(255,255,255,.12); --card-sh:none; --card-r:16px; --card-blur:none;
  --media-r:16px; --av-r:6px;
  --chip-bg:rgba(255,255,255,.12); --chip-ink:rgba(255,255,255,.75); --chip-bd:rgba(255,255,255,.12); --chip-r:6px;
  --title-font:'Exo',system-ui,sans-serif; --title-ls:0; --title-size:15.5px; --count-font:'Exo',system-ui,sans-serif;
  --bn-bg:rgba(9,9,11,.55); --bn-img:none; --bn-bd:.8px solid rgba(255,255,255,.1); --bn-r:16px; --bn-blur:blur(20px) saturate(1.5); --bn-sh:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1);
  --c-bg:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.07)); --c-bd:rgba(255,255,255,.22); --c-ink:#fff; --c-r:12px; --c-sh:0 2px 10px rgba(0,0,0,.35);
  --sheet-bg:rgba(12,12,14,.9); --sheet-img:none; --sheet-bd:rgba(255,255,255,.1); --sheet-r:22px; --tile-bg:rgba(255,255,255,.04); --tile-bd:rgba(255,255,255,.08); --tile-r:14px; --tile-on-bg:rgba(255,255,255,.1); --tile-on-bd:rgba(255,255,255,.22);
  --field-bg:rgba(255,255,255,.06); --field-bd:rgba(255,255,255,.1);
  --ham:#fff; --logo:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:375px;height:812px;overflow:hidden}
html{background:var(--page)}
body{font-family:'Exo',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;position:relative}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
#bg canvas{display:block}
.app{position:absolute;inset:0;z-index:1;overflow:hidden}

/* header */
.hdr{position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:center;background:var(--hdr);z-index:5}
.hdr .ham{position:absolute;left:12px;top:6px;width:32px;height:32px;display:grid;place-items:center;color:var(--ham);border-radius:8px}
.hdr .ham svg{width:31px;height:31px}
.hdr .logo{width:33px;height:28px;color:var(--logo)}
.hdr .bell{position:absolute;right:14px;top:10px;color:var(--ham);opacity:.9}
.hdr .bell svg{width:22px;height:22px}

/* feed tabs */
.tabs-wrap{position:absolute;top:44px;left:0;right:0;padding:4px 8px 12px;z-index:4;background:var(--strip)}
.tabs{position:relative;display:flex;height:44px;padding:4px;border-radius:var(--pill-r);background:var(--pill-bg);background-image:var(--pill-img);box-shadow:var(--pill-sh);backdrop-filter:var(--pill-blur);-webkit-backdrop-filter:var(--pill-blur)}
.tab{flex:1;display:grid;place-items:center;color:var(--tab-ink);position:relative;border-radius:var(--on-r)}
.tab svg{width:20px;height:20px}
.tab.on{color:var(--tab-on);background:var(--on-bg);box-shadow:var(--on-sh)}

/* feed */
.feed{position:absolute;top:104px;left:0;right:0;bottom:0;padding:0 8px 120px;display:flex;flex-direction:column;gap:14px;z-index:1}
.card{position:relative;padding:12px;border-radius:var(--card-r);background:var(--card-bg);background-image:var(--card-img);border:var(--card-bd);box-shadow:var(--card-sh);backdrop-filter:var(--card-blur);-webkit-backdrop-filter:var(--card-blur)}
.ph{display:flex;align-items:flex-start;gap:12px;padding-bottom:12px}
.av{width:40px;height:40px;border-radius:var(--av-r);flex:none;object-fit:cover;background:#222}
.av.letter{display:grid;place-items:center;font-weight:700;font-size:17px;color:#fff;background:linear-gradient(135deg,#3b82f6,#8b5cf6)}
.who{flex:1;min-width:0}
.nm{display:flex;align-items:center;gap:6px;font-weight:700;font-size:17px;line-height:1.2;white-space:nowrap}
.badge{width:18px;height:18px;flex:none}
.chip{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;font-size:10px;font-weight:600;border-radius:var(--chip-r);background:var(--chip-bg);color:var(--chip-ink);border:.8px solid var(--chip-bd)}
.chip svg{width:10px;height:10px}
.hd{font-size:14px;color:var(--mute);margin-top:2px}
.pa{display:flex;gap:10px;color:var(--icon);padding-top:2px}
.pa svg{width:22px;height:22px}
.pa .sp{color:var(--icon)}
.media{position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--media-r);overflow:hidden;background:#000}
.media img{width:100%;height:100%;object-fit:cover;display:block}
.media .dur{position:absolute;right:8px;bottom:8px;font:600 11px 'Exo',sans-serif;background:rgba(0,0,0,.65);color:#fff;padding:2px 6px;border-radius:6px}
.ttl{font-family:var(--title-font);font-size:var(--title-size);letter-spacing:var(--title-ls);line-height:1.45;margin-top:12px}
.meta{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mute);margin-top:8px}
.meta svg{width:14px;height:14px}
.acts{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--icon)}
.acts span{display:inline-flex;align-items:center;gap:5px;font-family:var(--count-font);font-size:13px}
.acts svg{width:21px;height:21px}

/* bottom nav */
.bn{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;z-index:6}
.bp{position:relative;display:flex;align-items:center;gap:4px;height:52px;padding:0 8px;border-radius:var(--bn-r);background:var(--bn-bg);background-image:var(--bn-img);border:var(--bn-bd);box-shadow:var(--bn-sh);backdrop-filter:var(--bn-blur);-webkit-backdrop-filter:var(--bn-blur)}
.bb{width:46px;height:40px;display:grid;place-items:center;color:var(--ink)}
.bb svg{width:23px;height:23px}
.bb.c{width:44px;height:38px;margin:0 3px;border-radius:var(--c-r);background:var(--c-bg);border:1px solid var(--c-bd);color:var(--c-ink);box-shadow:var(--c-sh)}

/* menu sheet (the web's hamburger opens a glass bottom sheet, 85% tall) */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:8;display:none}
.sheet{position:absolute;left:0;right:0;bottom:0;height:85%;z-index:9;display:none;flex-direction:column;padding:10px 16px 28px;border-radius:var(--sheet-r) var(--sheet-r) 0 0;background:var(--sheet-bg);background-image:var(--sheet-img);border-top:1px solid var(--sheet-bd);backdrop-filter:blur(28px) saturate(1.4);-webkit-backdrop-filter:blur(28px) saturate(1.4);box-shadow:0 -12px 40px rgba(0,0,0,.45)}
html[data-screen="menu"] .scrim,html[data-screen="menu"] .sheet{display:flex}
.grab{width:44px;height:5px;border-radius:9px;background:var(--mute);opacity:.5;margin:0 auto 14px}
.me{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.me .av{width:44px;height:44px}
.me b{display:block;font-size:17px}
.me small{font-size:13px;color:var(--mute)}
.me .bal{margin-left:auto;display:flex;align-items:center;gap:6px;font:600 13px var(--count-font);padding:6px 10px;border-radius:var(--chip-r);background:var(--chip-bg);border:.8px solid var(--chip-bd)}
.me .bal svg{width:15px;height:15px}
.field{display:flex;align-items:center;gap:10px;height:42px;padding:0 14px;border-radius:12px;background:var(--field-bg);border:1px solid var(--field-bd);color:var(--mute);font-size:14px;margin-bottom:16px}
.field svg{width:18px;height:18px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px 10px;border-radius:var(--tile-r);background:var(--tile-bg);border:.8px solid var(--tile-bd);font-size:12.5px;font-weight:500;color:var(--ink);position:relative}
.tile img{width:52px;height:52px;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}
.tile .g{width:52px;height:52px;display:grid;place-items:center}
.tile .g svg{width:28px;height:28px}
.tile.on{background:var(--tile-on-bg);border-color:var(--tile-on-bd)}

/* ===================== MINIMAL ===================== */
html[data-theme="minimal"]{
  --pill-bg:#000; --pill-sh:none; --pill-r:0; --pill-blur:none; --on-bg:#000; --on-sh:inset 0 1px 0 rgba(255,255,255,.69),inset 1px 0 0 rgba(255,255,255,.69),inset -1px 0 0 rgba(255,255,255,.69); --on-r:0;
  --card-bg:transparent; --card-bd:0; --card-r:0; --media-r:0; --av-r:0; --chip-r:0;
  --bn-bg:rgba(24,24,27,.1); --bn-r:0; --bn-blur:blur(40px); --c-r:0; --c-bg:rgba(255,255,255,.1); --c-bd:rgba(255,255,255,.3);
  --sheet-r:0; --tile-r:0; --tile-bg:transparent; --field-bg:#000;
}
html[data-theme="minimal"] .tabs,html[data-theme="light"] .tabs{padding:0 0;height:40px;border-bottom:1px solid var(--fold)}
html[data-theme="minimal"] .tabs-wrap,html[data-theme="light"] .tabs-wrap{padding:4px 0 0}
html[data-theme="minimal"] .tab.on,html[data-theme="light"] .tab.on{margin-bottom:-1px}
html[data-theme="minimal"] .tab.on,html[data-theme="light"] .tab.on{flex:0 0 76px}
html[data-theme="minimal"]{--fold:rgba(255,255,255,.69)}
html[data-theme="minimal"] .feed,html[data-theme="light"] .feed{top:96px;padding:0 0 120px;gap:0}
html[data-theme="minimal"] .card,html[data-theme="light"] .card{padding:14px 16px 16px;border-bottom:1px solid var(--div)}
html[data-theme="minimal"] .media,html[data-theme="light"] .media{width:calc(100% + 32px);margin:0 -16px}
html[data-theme="minimal"]{--div:rgba(255,255,255,.08)}

/* ===================== LIGHT ===================== */
html[data-theme="light"]{
  --page:#f9f8f4; --ink:#1a1a1a; --mute:#5a5a5a; --icon:#1a1a1a; --tab-ink:#8a8a8f; --tab-on:#1a1a1a; --hdr:transparent; --strip:transparent;
  --pill-bg:transparent; --pill-sh:none; --pill-r:0; --pill-blur:none; --on-bg:#f9f8f4; --on-sh:inset 0 1px 0 rgba(0,0,0,.12),inset 1px 0 0 rgba(0,0,0,.12),inset -1px 0 0 rgba(0,0,0,.12); --on-r:0; --fold:rgba(0,0,0,.12); --div:rgba(0,0,0,.08);
  --card-bg:transparent; --card-bd:0; --card-r:0; --media-r:0; --av-r:0; --chip-r:0; --chip-bg:rgba(0,0,0,.06); --chip-ink:#3a3a3a; --chip-bd:rgba(0,0,0,.14);
  --bn-bg:rgba(249,248,244,.8); --bn-bd:.8px solid rgba(0,0,0,.12); --bn-r:0; --bn-blur:blur(20px); --c-r:0; --c-bg:rgba(0,0,0,.05); --c-bd:rgba(0,0,0,.2); --c-ink:#1a1a1a; --c-sh:none;
  --sheet-bg:rgba(249,248,244,.96); --sheet-bd:rgba(0,0,0,.12); --sheet-r:0; --tile-bg:transparent; --tile-bd:rgba(0,0,0,.1); --tile-r:0; --tile-on-bg:rgba(0,0,0,.05); --tile-on-bd:rgba(0,0,0,.25); --field-bg:rgba(0,0,0,.04); --field-bd:rgba(0,0,0,.12);
  --ham:#1a1a1a; --logo:#1a1a1a;
}
html[data-theme="light"] body{background:#f9f8f4 url(../../../src/assets/textures/paper-texture.png);background-size:256px 256px}
html[data-theme="light"] .scrim{background:rgba(26,26,26,.25)}

/* ===================== CANVAS GLASS (cosmic / hazy / swarms / lavalamp / winter) ===================== */
html[data-theme="cosmic"],html[data-theme="hazy"],html[data-theme="swarms"],html[data-theme="lavalamp"],html[data-theme="winter"]{
  --hdr:transparent; --strip:transparent;
  --pill-bg:rgba(9,9,11,.82); --pill-blur:none;
  --card-bg:rgba(9,9,11,.82); --card-img:linear-gradient(160deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,.02) 38%,rgba(255,255,255,.04) 100%); --card-bd:.8px solid transparent; --card-sh:inset 0 0 0 1px rgba(255,255,255,.1),inset 0 1.5px 0 rgba(255,255,255,.08);
  --bn-bg:rgba(9,9,11,.86); --bn-blur:none;
  --sheet-bg:rgba(9,9,11,.8); --sheet-img:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02) 38%,rgba(255,255,255,.04));
}
html[data-theme="winter"]{background:#05070a radial-gradient(120rem 60rem at 85% -20%,rgba(164,196,228,.10),transparent 55%)}

/* ===================== WAR ===================== */
html[data-theme="war"]{
  --page:rgb(6,10,9); --hdr:transparent; --strip:transparent; --mute:rgba(197,186,156,.8); --icon:rgba(214,208,190,.85); --tab-ink:rgb(190,196,194); --tab-on:rgb(79,227,224);
  --pill-bg:transparent; --pill-sh:none; --pill-r:0; --pill-blur:none;
  --on-bg:rgba(79,227,224,.12); --on-sh:inset 0 0 0 1px rgba(79,227,224,.55),0 0 14px rgba(79,227,224,.18); --on-r:0;
  --card-bg:rgba(14,20,18,.8); --card-bd:.8px solid transparent; --card-sh:inset 0 0 0 1px rgba(79,227,224,.32),inset 0 1px 0 rgba(79,227,224,.14); --card-r:0; --media-r:2px; --av-r:0;
  --chip-bg:rgba(255,255,255,.08); --chip-bd:rgba(79,227,224,.35); --chip-r:0;
  --title-font:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; --title-ls:.1em; --title-size:14.5px; --count-font:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --bn-bg:transparent; --bn-bd:0; --bn-r:0; --bn-blur:none; --bn-sh:none;
  --c-bg:rgba(79,227,224,.14); --c-bd:rgba(79,227,224,.8); --c-ink:rgb(79,227,224); --c-r:0; --c-sh:0 0 14px rgba(79,227,224,.3),inset 0 0 10px rgba(79,227,224,.15);
  --sheet-bg:rgba(8,13,12,.94); --sheet-bd:rgba(79,227,224,.5); --sheet-r:0; --tile-bg:rgba(14,20,18,.8); --tile-bd:rgba(79,227,224,.28); --tile-r:0; --tile-on-bg:rgba(79,227,224,.12); --tile-on-bd:rgba(79,227,224,.7); --field-bg:rgba(79,227,224,.05); --field-bd:rgba(79,227,224,.35);
  --ham:rgb(88,230,168); --logo:rgb(214,246,245);
}
html[data-theme="war"] .ham{filter:drop-shadow(0 0 6px rgba(88,230,168,.6))}
html[data-theme="war"] .logo{filter:drop-shadow(0 0 6px rgba(79,227,224,.55))}
/* cut corners + HUD corner brackets, as war-frame.css / war-nav.css draw them */
.war-fill,.war-br{position:absolute;inset:0;pointer-events:none;display:none}
html[data-theme="war"] .war-fill,html[data-theme="war"] .war-br{display:block}
html[data-theme="war"] .tabs .war-fill{background:rgba(14,20,18,.9);clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px));box-shadow:inset 0 0 0 1px rgba(79,227,224,.3)}
html[data-theme="war"] .tabs{background:none}
html[data-theme="war"] .tabs .war-fill::before{content:"";position:absolute;inset:0;clip-path:inherit;border:1px solid rgba(79,227,224,.32)}
html[data-theme="war"] .war-br{--L:12px;--W:1.5px;--C:rgba(79,227,224,.8);
  background:
   linear-gradient(var(--C),var(--C)) top left/var(--L) var(--W) no-repeat,
   linear-gradient(var(--C),var(--C)) top left/var(--W) var(--L) no-repeat,
   linear-gradient(var(--C),var(--C)) top right/var(--L) var(--W) no-repeat,
   linear-gradient(var(--C),var(--C)) top right/var(--W) var(--L) no-repeat,
   linear-gradient(var(--C),var(--C)) bottom left/var(--L) var(--W) no-repeat,
   linear-gradient(var(--C),var(--C)) bottom left/var(--W) var(--L) no-repeat,
   linear-gradient(var(--C),var(--C)) bottom right/var(--L) var(--W) no-repeat,
   linear-gradient(var(--C),var(--C)) bottom right/var(--W) var(--L) no-repeat;
  filter:drop-shadow(0 0 3px rgba(79,227,224,.45))}
html[data-theme="war"] .tabs .war-br{clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px))}
html[data-theme="war"] .tab.on{clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%)}
html[data-theme="war"] .bp .war-fill{background:rgba(14,20,18,.9);clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%,0 10px);box-shadow:0 -6px 22px rgba(0,0,0,.5)}
html[data-theme="war"] .bp .war-br{clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%,0 10px);--C:rgba(79,227,224,.55)}
html[data-theme="war"] .bp .war-fill::after{content:"";position:absolute;inset:0;border-top:1px solid rgba(79,227,224,.4)}
html[data-theme="war"] .bb,html[data-theme="war"] .tab{z-index:1}
html[data-theme="war"] .card .war-br{--L:10px;--C:rgba(79,227,224,.7)}
html[data-theme="war"] .sheet .war-br{--L:18px;--C:rgba(79,227,224,.9);inset:6px}
html[data-theme="war"] .tile .war-br{--L:8px;--W:1px;--C:rgba(79,227,224,.6)}
html[data-theme="war"] .tile .g{color:rgb(79,227,224);filter:drop-shadow(0 0 6px rgba(79,227,224,.5))}
html[data-theme="war"] .tile{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
html[data-theme="war"] .nm,html[data-theme="war"] .me b{letter-spacing:.01em}
html[data-theme="war"] .grab{border-radius:0;background:rgb(79,227,224);opacity:.8;height:3px}
html[data-theme="war"] .field{border-radius:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase}

/* ===================== OSAKA ===================== */
html[data-theme="osaka"]{
  --page:rgb(10,8,18); --hdr:transparent; --strip:transparent; --ink:rgb(236,233,245); --mute:rgb(176,170,196); --icon:rgb(236,233,245); --tab-ink:rgb(176,170,196); --tab-on:rgb(255,111,181);
  --osaka-sheen:linear-gradient(178deg,rgba(255,111,181,.13) 0%,rgba(111,227,255,.05) 26%,rgba(17,14,28,0) 58%);
  --pill-bg:rgba(17,14,28,.84); --pill-img:var(--osaka-sheen); --pill-sh:inset 0 0 0 1px rgba(236,233,245,.1),inset 0 1.5px 0 rgba(236,233,245,.2),inset 0 -1px 0 rgba(255,111,181,.16),0 10px 34px rgba(4,2,10,.5); --pill-r:16px; --pill-blur:none;
  --on-bg:rgba(255,111,181,.1); --on-sh:inset 0 0 0 1px rgba(255,111,181,.7),0 0 14px rgba(255,111,181,.35),inset 0 0 12px rgba(255,111,181,.12);
  --card-bg:rgba(17,14,28,.84); --card-img:var(--osaka-sheen); --card-bd:.8px solid transparent; --card-sh:inset 0 0 0 1px rgba(236,233,245,.09),inset 0 1.5px 0 rgba(236,233,245,.16),inset 0 -1px 0 rgba(255,111,181,.14);
  --chip-ink:rgba(236,233,245,.7); --chip-bd:rgba(236,233,245,.1);
  --bn-bg:rgba(17,14,28,.88); --bn-img:var(--osaka-sheen); --bn-bd:.8px solid transparent; --bn-blur:none; --bn-sh:inset 0 0 0 1px rgba(236,233,245,.1),inset 0 1.5px 0 rgba(236,233,245,.2),inset 0 -1px 0 rgba(255,111,181,.16),0 10px 34px rgba(4,2,10,.5);
  --c-bg:rgba(255,111,181,.1); --c-bd:rgba(255,111,181,.75); --c-ink:rgb(255,190,222); --c-sh:0 0 16px rgba(255,111,181,.4),inset 0 0 10px rgba(255,111,181,.15); --c-r:14px;
