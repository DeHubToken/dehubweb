<!doctype html>
<html lang="en">
  <head>
    <script type="module">
      import { Buffer } from 'buffer'
      import process from 'process'
      window.Buffer = Buffer
      window.process = process
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <!-- Apply the saved theme (+ dim settings) to <html> synchronously, during
         head parse — before the render-blocking stylesheet is matched and long
         before React mounts. ThemeContext also sets data-theme, but only in a
         PASSIVE effect that React defers under load, so a light-theme reload
         painted the dark default first: the sidebar's bg-zinc-* tiles flashed
         as ugly black boxes until the effect ran. Must be a classic (non-module)
         script so it runs inline at parse time, not deferred. Keys/migration/
         defaults mirror ThemeContext.tsx — keep them in sync. -->
    <script>
      (function () {
        try {
          var d = document.documentElement;
          var t = localStorage.getItem('dehub.theme') || 'system';
          if (t === 'christmas') t = 'winter'; // legacy name migration
          d.dataset.theme = t;

          // color-scheme is what the browser paints the CANVAS with — the
          // backdrop it shows for a document before that document's own styles
          // have painted, plus the scrollbars and the overscroll/rubber-band
          // area. Left undeclared it computes to `normal`, i.e. light, i.e.
          // WHITE, which is the flash on reload: nothing in the app's CSS can
          // prevent it, because it happens before any stylesheet applies. Eight
          // of the eleven themes (cosmic/hazy/swarms/lavalamp/winter/war/osaka/
          // jungle) make body AND #app-root `transparent !important` so their
          // canvas shows through, leaving <html> as the only thing that paints
          // — so on those the white canvas stays visible for the whole of that
          // window rather than being covered by an opaque body.
          d.style.colorScheme = t === 'light' ? 'light' : 'dark';

          // Paint the theme's own backdrop NOW, at head-parse time, rather than
          // waiting for the render-blocking stylesheet that normally carries it.
          // Values mirror the settled `background-color` of <html> per theme —
          // keep them in sync with index.css if a theme's backdrop changes.
          var BG = { light: '#f9f8f4', osaka: '#0a0812', jungle: '#16110c' };
          d.style.setProperty('--boot-bg', BG[t] || '#000');
          d.style.setProperty('--boot-fg', t === 'light' ? '#09090b' : '#fff');

          d.dataset.dimLights = localStorage.getItem('dehub.dimLights') === '1' ? 'true' : 'false';
          var s = Number(localStorage.getItem('dehub.dimStrength'));
          if (!(s > 0)) s = 50;
          s = Math.min(100, s);
          d.style.setProperty('--dim-lights-opacity', (0.12 + 0.6 * (s / 100)).toFixed(3));

          // Frost the app shell from the FIRST painted frame (the sheet itself
          // is html[data-feed-loading] #app-root::after, in index.css), so the
          // welcome panel is the only thing that ever reads as sharp and
          // everything else — skeletons, spinners, the sidebars, the theme
          // canvas — resolves in behind it.
          //
          // This must be set HERE, not from React. The first attempt drove it
          // off the home feed's isLoadingState, which is usually ALREADY FALSE
          // by the time HomeFeed first renders: the boot prefetch below starts
          // page 1 at parse time and use-unified-feed adopts it, and the
          // persisted query cache restores synchronously. So the frost almost
          // never appeared, and when it did the skeletons had already painted
          // sharp before React got there — the wrong order, which is the whole
          // point of the effect.
          //
          // HomeFeed clears it (to "off", then removes it) once page 1 has
          // resolved; the timer below is the guarantee for every path that
          // never reaches HomeFeed at all — a failed chunk, a thrown boundary,
          // a redirect — because an app left permanently frosted is worse than
          // one that never frosted.
          // 12s, well clear of HomeFeed's own 3s hold + 8s bail. This is the
          // last-resort unfreeze for a bundle that never arrives, NOT part of
          // the normal timing — set it too close and it starts cutting the
          // intended hold short on a slow connection, which is exactly the case
          // it was meant to protect.
          if (location.pathname === '/') {
            d.dataset.feedLoading = 'on';
            setTimeout(function () {
              if (d.dataset.feedLoading === 'on') d.dataset.feedLoading = 'off';
              setTimeout(function () { delete d.dataset.feedLoading; }, 1300);
            }, 12000);
          }
        } catch (e) { /* never block boot */ }
      })();
    </script>
    <!-- Belt and braces for the line above: if the inline script is stripped
         (the Lovable mirror hosts do this) the meta still gets the browser off
         its white canvas default. The script wins where both run, because it
         can tell the light theme apart. -->
    <meta name="color-scheme" content="dark light" />
    <title>DeHub — Open Source, User Owned Social Media</title>
    <meta name="description" content="DeHub is the open source, user-owned and censorship-resistant social platform for Web3 creators and communities.">
    <meta name="author" content="DeHub" />
    <meta name="robots" content="index, follow">
    <!-- Mirror hosts (cosmic-echo-hero.lovable.app etc.) serve this same build
         outside our Cloudflare worker, so they can't get an X-Robots-Tag header;
         flip robots to noindex client-side so rendered crawls never index a
         duplicate of dehub.io. -->
    <script>
      if (location.hostname !== "dehub.io" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
        var dhRobots = document.querySelector('meta[name="robots"]');
        if (dhRobots) dhRobots.setAttribute("content", "noindex, nofollow");
      }
    </script>
    <meta name="google-site-verification" content="fCbsM2lCr6JdQuMh1uHAHwzbLC1OoXzvK-VKFnkbZnQ" />
    <!-- Canonical set per-route imperatively (SEOHead/DocsSEO via lib/head-meta) so each leaf route self-references -->

    <!-- Organization entity: one canonical identity + sameAs graph so Google can
         reconcile the DeHub brand across properties. Keep this list in sync with
         ORG_SAME_AS in CLOUDFLARE_WORKER_SEO.js. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "DeHub",
      "url": "https://dehub.io",
      "logo": "https://aigxuutjaqsywioxjefr.supabase.co/storage/v1/object/public/logo//new_logo_Dehub.jpg",
      "description": "DeHub is the open source, user-owned and censorship-resistant social platform for Web3 creators and communities.",
      "sameAs": [
        "https://www.wikidata.org/wiki/Q140518527",
        "https://x.com/dehub_official",
        "https://github.com/DeHubToken",
        "https://www.linkedin.com/company/dehub-dao",
        "https://t.me/dehub_dhb",
        "https://play.google.com/store/apps/details?id=io.dehub.mobile",
        "https://www.coingecko.com/en/coins/dehub",
        "https://coinmarketcap.com/currencies/dehub/"
      ]
    }
    </script>

    <!-- WebSite entity: reinforces dehub.io as the canonical DeHub site (distinct
         from the DePaul/Rowan "DeHUB" university portals) for the brand term. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "DeHub",
      "alternateName": "DeHub — Decentralised Social Network",
      "url": "https://dehub.io",
      "publisher": { "@type": "Organization", "name": "DeHub", "url": "https://dehub.io" }
    }
    </script>

    <!-- SoftwareApplication entity: tells Google/AI that DeHub is a free social
         networking app (not a university portal), and links the Google Play app. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "DeHub",
      "applicationCategory": "SocialNetworkingApplication",
      "operatingSystem": "Android, Web",
      "url": "https://dehub.io",
      "downloadUrl": "https://play.google.com/store/apps/details?id=io.dehub.mobile",
      "publisher": { "@type": "Organization", "name": "DeHub", "url": "https://dehub.io" },
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "description": "DeHub is an open-source, user-owned, censorship-resistant decentralised social network for Web3 creators and communities, with watch-to-earn, tokenised on-chain subscriptions, live streaming and play-to-earn."
    }
    </script>

    <!-- Open Graph — generic brand fallback; per-route tags override via Helmet -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DeHub" />
    
    
    <meta property="og:image" content="https://dehub.io/og/home.jpg">
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://dehub.io/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@dehub_official" />
    
    
    <meta name="twitter:image" content="https://dehub.io/og/home.jpg">

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" href="/dehub-icon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">

    <!-- Always-used origins (every route, incl. light landing pages like /prompt):
         Supabase (edge fns / i18n / storage) and Google Fonts (the Exo file + its
         CSS). These stay as static <link>s so the preload scanner finds them at
         the earliest possible moment. -->
    <link rel="preconnect" href="https://aigxuutjaqsywioxjefr.supabase.co" crossorigin>
    <!-- fonts.gstatic.com serves the actual Exo font file (preloaded below) —
         a full preconnect here shaves a DNS+TLS round-trip off heading paint -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- fonts.googleapis.com serves the Exo @font-face CSS (preloaded below) -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">

    <!-- Route-aware boot warming + feed prefetch.
         api.dehub.io (feed API, CORS fetch) and the DO Spaces CDN (post media) are
         contacted ONLY inside the app tree ("/" and "/app/*"). Warming them on
         light landing routes like /prompt, /docs or the SEO pages just opens
         sockets that are never used (DebugBear "resource hint not used" 7/15).
         Emitting the hints from this inline head script — which the parser runs
         before <body> — keeps them nearly as early as a static <link> on the
         routes that DO need them, and skips them everywhere else. Wallet origins
         (web3auth / web3modal / walletconnect) are warmed separately, on login
         intent (warmWalletOrigins in AuthProvider), so they no longer sit unused
         here either. Lovable mirror hosts strip inline scripts — the app's hooks
         then connect normally, so the only loss is the head-start, never correctness. -->
    <script>
      (function () {
        try {
          var p = location.pathname;
          var isApp = p === "/" || p === "/app" || p.indexOf("/app/") === 0;

          if (isApp) {
            var head = document.head;
            var hint = function (rel, href, cors) {
              var l = document.createElement("link");
              l.rel = rel;
              l.href = href;
              if (cors) l.crossOrigin = "anonymous";
              head.appendChild(l);
            };
            // Feed API is hit at boot via fetch() (CORS) — the warmed socket is
            // reused only when the preconnect is crossorigin (DebugBear 7/14).
            hint("preconnect", "https://api.dehub.io", true);
            // Posters + avatars stream from DO Spaces via Cloudflare as plain
            // <img> (non-CORS) — no crossorigin, or the socket wouldn't be reused.
            hint("preconnect", "https://dehubcdn.ams3.cdn.digitaloceanspaces.com", false);
            hint("dns-prefetch", "https://dehubcdn.ams3.cdn.digitaloceanspaces.com", false);
          }

          // Boot feed fetch: start the page-1 /api/feed request at parse time,
          // long before the entry bundle downloads and React mounts (LCP audit
          // 7/14: the hook-issued request didn't hit the wire until ~1.8s). The
          // promise is adopted by fetchUnifiedFeedFromAPI (use-unified-feed.ts)
          // only when the params match this exact default request; any mismatch,
          // error, or non-OK response resolves null and the hook fetches normally.
          // Gated to the default-feed routes only (deep /app/* routes request
          // different params, so they can't adopt this promise anyway).
          // The token is sent only while it is still live: /api/feed answers an
          // expired one with 200 and a body stripped of per-viewer fields
          // (isLiked…), which the SPA would cache as "this user liked nothing".
          // __DEHUB_FEED_VIEWER__ records whose engagement state this response
          // describes so the SPA refuses to adopt it for anyone else.
          // The welcome panel's silk plate. It is a CSS background set from an
          // inline style in HomeIntro, so the preload scanner cannot see it —
          // it is only discovered once React has rendered and styles resolve,
          // which is why the panel sat as an empty box while the sidebars (text
          // and inline SVG, zero requests) painted immediately. Hinting it here
          // puts it on the wire at parse time instead. Root only: that is the
          // one route the panel renders on.
          // Not via hint() above: that helper sets only rel/href, and a
          // rel="preload" without an `as` is ignored by the browser (and warns).
          if (p === "/") {
            var plate = document.createElement("link");
            plate.rel = "preload";
            plate.as = "image";
            plate.href = "/brand-kit/bg/bg-16.jpg";
            document.head.appendChild(plate);
          }

          if (p === "/" || p === "/app" || p === "/app/") {
            var h = { "Accept": "application/json", "Content-Type": "application/json" };
            var t = localStorage.getItem("dehub_token");
            var exp = parseInt(localStorage.getItem("dehub_token_expires_at") || "0", 10);
            var live = !!t && (!exp || Date.now() < exp);
            if (live) h["Authorization"] = "Bearer " + t;
            window.__DEHUB_FEED_VIEWER__ = live
              ? (localStorage.getItem("dehub_wallet") || "").toLowerCase() || null
              : null;
            window.__DEHUB_FEED__ = fetch(
              "https://api.dehub.io/api/feed?page=1&limit=20&sortBy=createdAt&sortOrder=desc&status=all",
              { headers: h }
            ).then(function (r) { return r.ok ? r.json() : null; })
             .catch(function () { return null; });
          }
        } catch (e) { /* never block boot */ }
      })();
    </script>

    <!-- LCP: header logo — same URL as DesktopSidebar / MobileHeader so browser discovers early -->
    <link rel="preload" as="image" href="/dehub-header-logo.png" fetchpriority="high">

    <!-- Exo font: non-blocking load (avoids @import in index.css blocking Tailwind parse / main thread) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Exo:wght@400;700;900&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo:wght@400;700;900&display=swap" />
    </noscript>

    <!-- Noto Color Emoji: fills the gaps in the platform emoji font (Windows has
         no flag glyphs, older Segoe UI Emoji misses recent codepoints). Google
         serves it as ~10 unicode-range subsets, so a browser downloads only the
         chunk for an emoji it can't already draw — and nothing at all on
         Android/macOS, where the system font wins earlier in the stack.
         Deferred to idle-after-load rather than preloaded alongside Exo. On
         Windows the subsets it actually picks are big — a real load of
         dehub.io in Aug 2026 pulled 693 KB + 135 KB of woff2 — and spending
         that during the load window costs bandwidth for glyphs that are, by
         definition, never the largest contentful paint. `display=swap` already
         means emoji paint in the platform font first and upgrade on arrival,
         so deferring changes only WHEN the upgrade lands, not whether. -->
    <script>
      (function () {
        var href = 'https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap';
        function loadEmojiFont() {
          var l = document.createElement('link');
          l.rel = 'stylesheet';
          l.href = href;
          document.head.appendChild(l);
        }
        // Idle callback keeps it off the tail of the load event too, so it
        // never competes with the app's own post-load work. The timeout is the
        // guarantee it still happens on a permanently busy main thread.
        function schedule() {
          if ('requestIdleCallback' in window) {
            requestIdleCallback(loadEmojiFont, { timeout: 3000 });
          } else {
            setTimeout(loadEmojiFont, 1200);
          }
        }
        if (document.readyState === 'complete') schedule();
        else window.addEventListener('load', schedule, { once: true });
      })();
    </script>
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" />
    </noscript>

    <!-- Critical CSS — prevents the pre-stylesheet flash.
         Colours come from --boot-bg / --boot-fg, set per theme by the head
         script above, so this no longer hard-codes #000 for all eleven themes:
         that made the light theme flash BLACK on every reload, the same bug in
         the other direction. The fallbacks in var() cover the stripped-script
         case. -->
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; width: 100%; background-color: var(--boot-bg, #000); color: var(--boot-fg, #fff); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #root { height: 100%; min-height: 100dvh; background-color: var(--boot-bg, #000); }
    </style>
  
  
  
  
  <meta property="og:title" content="DeHub — Open Source, User Owned Social Media">
  <meta name="twitter:title" content="DeHub — Open Source, User Owned Social Media">
  <meta property="og:description" content="DeHub is the open source, user-owned and censorship-resistant social platform for Web3 creators and communities.">
  <meta name="twitter:description" content="DeHub is the open source, user-owned and censorship-resistant social platform for Web3 creators and communities.">
</head>

  <body>
    <div id="root"></div>
    <!-- No-JS fallback. The app is client-rendered, so anything that fetches
         this page without executing JS previously saw an empty <div id="root">
         and nothing else. The Cloudflare worker only prerenders for UAs matching
         BOT_UA_PATTERN, which misses non-crawler fetchers — Google's OAuth
         verification checker among them, which reported dehub.io as
         unresponsive (July 2026). This block guarantees every no-JS fetch gets
         the app name, what it does, and the policy links reviewers look for. -->
    <noscript>
      <div style="font-family: sans-serif; background: #000; color: #fff; min-height: 100vh; margin: 0; padding: 40px 20px; box-sizing: border-box;">
        <div style="max-width: 720px; margin: 0 auto; text-align: center;">
          <h1>DeHub — Open Source, User Owned Social Media</h1>
          <p>DeHub is the open source, user-owned and censorship-resistant social platform for Web3 creators and communities. Post, stream, message and earn on a network you own.</p>
          <p>DeHub needs JavaScript to run. Please enable it, or open the app at <a href="https://dehub.io/" style="color:#9f9">dehub.io</a>.</p>
          <nav style="margin-top: 24px; font-size: 14px;">
            <a href="/app/explore" style="color:#aaa; margin:0 8px;">Explore</a>
            <a href="/features" style="color:#aaa; margin:0 8px;">Features</a>
            <a href="/docs" style="color:#aaa; margin:0 8px;">Docs</a>
            <a href="/docs/privacy" style="color:#aaa; margin:0 8px;">Privacy Policy</a>
            <a href="/docs/terms" style="color:#aaa; margin:0 8px;">Terms of Service</a>
            <a href="/delete-account" style="color:#aaa; margin:0 8px;">Delete Account</a>
          </nav>
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
