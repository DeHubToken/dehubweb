  # ── ElevenLabs audio ───────────────────────────────────────────────────────
  # Listed so the setting is a decision on the record rather than a default
  # nobody chose. It stays false for the usual reason — auth is the DeHub token
  # in x-dehub-token, not a Supabase JWT — and the guard is in the function.
