location = /internal/video-dubs/recordings {
    client_max_body_size 2m;
    proxy_pass http://127.0.0.1:7862/recordings;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 190s;
}
location = /internal/video-dubs/stage-jobs {
    client_max_body_size 2m;
    proxy_pass http://127.0.0.1:7862/jobs;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 25s;
}
