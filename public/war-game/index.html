<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>OVERWATCH — Tactical Shooter</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      body { font-family: "Inter", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
      #game { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: none; }
    </style>
    <script>
      /*
       * DeHub addition, not upstream. See README.md in this directory.
       *
       * The game generates every texture, mesh and particle atlas in JS at
       * boot: world init alone measured ~48s in one probe, and it ships no
       * loading UI, so it paints pure black the whole time. That is
       * indistinguishable from a crash, and it is why the embed looked broken.
       *
       * The engine already narrates its progress through console.info. This
       * mirrors those lines to the parent frame so the host can render a real
       * loading readout. The frame is sandboxed into an opaque origin, so
       * postMessage is the only channel available, and the target is left as
       * "*" because an opaque origin cannot name its parent. Nothing sensitive
       * crosses: only the engine's own progress strings.
       */
      (function () {
        var send = function (type, text) {
          try {
            parent.postMessage({ source: 'war-game', type: type, text: text }, '*');
          } catch (e) {
            /* no parent, or blocked: the game still runs */
          }
        };
        // Hook every level the engine might narrate through. Which one it uses
        // is an implementation detail of upstream and could change on an
        // update, so mirroring all of them is the durable choice.
        ['log', 'info', 'debug'].forEach(function (level) {
          var original = console[level].bind(console);
          console[level] = function () {
            try {
              var line = Array.prototype.join.call(arguments, ' ');
              // Only the engine's own bracketed subsystem lines are of
              // interest; anything else is noise for a loading readout.
              if (line.charAt(0) === '[') {
                send('progress', line);
                // Logged once the last subsystem has finished initialising.
                if (line.indexOf('[fx] atlases') !== -1) send('ready', line);
              }
            } catch (e) {
              /* never let reporting break the game */
            }
            return original.apply(console, arguments);
          };
        });
        window.addEventListener('error', function (e) {
          send('error', (e && e.message) || 'unknown error');
        });
        send('booting', 'module queued');
      })();
    </script>
    <script type="module" crossorigin src="/war-game/assets/index-BQhdkP8T.js"></script>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
  </body>
</html>
