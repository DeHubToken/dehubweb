<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jungle Trail</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070a; }
  /* The canvas is the entire experience — no HUD, no overlay, nothing that
     would remind you it is a program. */
  #view { display: block; width: 100vw; height: 100vh; }
  #boot {
    position: fixed; inset: 0; display: grid; place-items: center;
    font: 300 13px/1.7 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: .22em; text-transform: uppercase; color: #6d7a63;
    background: #05070a; pointer-events: none;
  }

  /* VENDORED CHANGE 3 of 4 (styles) — the Escape panel. Borrows #boot's type
     so it reads as part of the same quiet world rather than as browser chrome,
     and it is `display:none` until Escape asks for it, so the note above about
     the canvas being the entire experience still holds for anyone just walking.

     The z-index is load-bearing since change 4: the touch layer is a positioned
     element at z-index 5, and this panel comes earlier in the document, so
     without a number of its own the stick and the buttons would be painted over
     the top of the menu that is supposed to be covering them. */
  #esc {
    position: fixed; inset: 0; display: none; place-items: center; z-index: 10;
    background: rgba(5, 7, 10, .72); backdrop-filter: blur(3px);
    font: 300 13px/1.7 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: .22em; text-transform: uppercase; color: #9fae93;
  }
  #esc[data-open="1"] { display: grid; }
  #esc .panel { display: grid; gap: 14px; justify-items: center; padding: 26px 34px; }
  #esc button {
    font: inherit; letter-spacing: inherit; text-transform: inherit;
    min-width: 15rem; padding: 12px 20px; cursor: pointer; color: #cfdcc4;
    background: rgba(12, 18, 12, .82); border: 1px solid rgba(160, 190, 150, .28);
    border-radius: 2px; transition: background .18s, border-color .18s, color .18s;
  }
  #esc button:hover { background: rgba(24, 34, 22, .92); border-color: rgba(190, 220, 180, .5); color: #eaf3e2; }
  #esc .hint { font-size: 11px; color: #5f6d57; }
</style>
<!--
  VENDORED CHANGE 1 of 4 — the import map points at a local copy of three.

  Upstream resolves `three` from jsDelivr. That is right for a repo you clone
  and serve yourself, and wrong here for three reasons: it makes a third-party
  request from a user's session on every play, it fails on any network that
  blocks the CDN, and it means a page on dehub.io can be broken by an outage
  nobody here controls. The file in vendor/ is the same build the import map
  named (three 0.170.0), just served from this origin.

  Keep the version pinned. The game targets r170 specifically, and the parent
  app is on 0.181 — which is exactly why this runs in an iframe rather than
  being imported (see README.md next to this file). The two dependency trees
  never meet.
-->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
<!--
  VENDORED CHANGE 2 of 4 — a progress bridge to the parent frame.

  The game generates every mesh, texture and sound on the device at boot, and
  renders nothing at all until that finishes. Upstream is fine with this:
  standalone, you are looking at its own "jungle trail" boot card. Embedded,
  the parent needs to tell "still building" from "dead", because a black
  rectangle is what both look like — and getting that wrong is precisely how
  the War launcher was first reported as broken.

  The bridge is deliberately tiny and OUTSIDE the module: it observes public
  DOM and globals rather than patching anything the engine owns. An earlier
  attempt on the War build intercepted console to read the engine's own
  progress logs, and that stopped the engine running at all.
-->
<script>
(function () {
  var done = false;

  function send(type, text) {
    try {
      parent.postMessage({ source: 'jungle-game', type: type, text: text }, '*');
    } catch (e) { /* no parent, or a parent that will not take messages */ }
  }

  /* NOTE ON THE HEARTBEAT THAT USED TO BE HERE.
     This sent an elapsed second count every second, which the host rendered as
     "T+012S". That is gone: the host now draws a percentage bar off its own
     clock, so it needs nothing per-second from in here, and a timer that only
     feeds a display nobody reads is just a wakeup. The bake still cannot be
     measured from out here — it happens inside one synchronous constructor —
     which is exactly why the host models it rather than reporting it.

     What is left below is the part that could never be modelled: the moment the
     engine is actually up, and any error that stops it getting there. */

  /* Ready = the engine has constructed itself AND started its loop AND removed
     its own boot card. All three, because `window.__game` is assigned before
     begin() returns and the loop is what actually puts pixels up. */
  var poll = setInterval(function () {
    if (done) return;
    var g = window.__game;
    if (g && g.running && !document.getElementById('boot')) {
      done = true;
      clearInterval(poll);
      send('ready', '');
    }
  }, 250);

  /* A module that throws during evaluation never assigns __game, so without
     this the parent would wait out its whole timeout on an error it could have
     shown immediately.

     Only errors provably raised by this page's own files are forwarded. The
     frame is sandboxed without allow-same-origin, and wallet extensions inject
     scripts into it anyway — MetaMask's cannot reach its extension from an
     opaque origin and dies with an uncaught "Failed to connect to MetaMask".
     Unfiltered, that got relayed here and the host printed a wallet error over
     the boot bar of a game with no wallet code in it, which players read as
     the reason it "didn't load". Extension stacks name chrome-extension://
     URLs and cross-origin scripts throw muted errors with no filename, so
     anchoring on this directory's URL drops both. */
  var HERE = location.origin + location.pathname.replace(/[^/]*$/, '');
  function ours(s) {
    return typeof s === 'string' && s.indexOf(HERE) !== -1;
  }
  addEventListener('error', function (e) {
    if (!e || !ours(e.filename)) return;
    send('error', e.message || 'script error');
  });
  addEventListener('unhandledrejection', function (e) {
    var reason = e && e.reason;
    if (!reason || !ours(reason.stack)) return;
    send('error', reason.message || 'load failed');
  });
})();
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="boot">jungle trail</div>

<!--
  VENDORED CHANGE 3 of 4 — an Escape panel, so there is a way out from inside.

  Unlike the other two games, upstream has no settings or pause menu to add a
  close button to: the stylesheet above says so in as many words, and Escape
  does nothing here but hand the mouse back. That is right standalone — you
  close the tab. Embedded it is not: dehub.io frames this in an iframe
  sandboxed WITHOUT `allow-same-origin`, so a keydown in here never reaches the
  host document and the host's own exit control cannot be aimed at while the
  walk holds the pointer. Without this the only way out was the browser's back
  button.

  So this is the smallest menu that answers the question. It is hidden until
  Escape is pressed, it is created only when embedded, and nothing under `src/`
  is touched — the engine does not know it exists.
-->
<div id="esc" aria-hidden="true">
  <div class="panel" role="dialog" aria-modal="true" aria-label="Paused">
    <button id="esc-resume" type="button">Keep walking</button>
    <button id="esc-leave" type="button">Leave the trail</button>
    <div class="hint">Esc to go back</div>
  </div>
</div>

<script>
(function () {
  /* Standalone there is nothing to return to, so the panel stays inert and the
     experience is exactly upstream's. */
  if (window.parent === window) return;

  var panel = document.getElementById('esc');
  var open = false;

  function show(next) {
    open = next;
    panel.setAttribute('data-open', open ? '1' : '0');
    panel.setAttribute('aria-hidden', open ? 'false' : 'true');
    /* Focus the safe choice, so a keyboard player who opened this by accident
       can Enter their way straight back into the walk. */
    if (open) document.getElementById('esc-resume').focus();
  }

  /* Escape is the browser's own gesture for releasing pointer lock, and the
     keydown still arrives — so by the time this runs the mouse is already free
     and the panel is clickable. Pressing it again closes the panel, which makes
     the key a toggle rather than a one-way door. The engine's own re-lock is on
     a canvas click, and these buttons are not the canvas, so clicking here does
     not silently grab the pointer back. */
  addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    show(!open);
  });

  document.getElementById('esc-resume').addEventListener('click', function () {
    show(false);
  });

  document.getElementById('esc-leave').addEventListener('click', function () {
    try {
      /* Give the mouse back before leaving: a lock that outlives the frame
         leaves the host page with a captured cursor and no way to explain it. */
      if (document.pointerLockElement) document.exitPointerLock();
      parent.postMessage({ source: 'jungle-game', type: 'exit' }, '*');
    } catch (err) { /* a host that has gone away is not worth surfacing */ }
  });
})();
</script>

<!--
  VENDORED CHANGE 4 of 4 — touch controls.

  Upstream is mouse-and-keyboard only, and not by omission: the walk is
  `requestPointerLock` plus `mousemove` for the head and `keydown`/`keyup` for
  the legs (`src/player/controller.js`), with no touch handler anywhere. A
  phone therefore reached the end of the bake and stood in a rainforest it
  could not move in — and the arcade's native app is a WebView, which is never
  granted pointer lock, so a keyboard would not have rescued it either.

  The shared layer that draws the stick and the buttons lives in
  /arcade-touch/, not in here, because this directory is a straight copy of
  upstream and a re-vendor would delete it. What is left below is only the
  adapter: what THIS engine wants done with a thumb.

  Nothing under `src/` is touched. The Walker exposes everything needed —
  `keys` is a plain map the input loop reads every frame, and `yaw`/`pitch` are
  plain numbers — so this drives the same fields the keyboard and mouse drive
  rather than simulating events at them.
-->
<script src="/arcade-touch/touch-controls.js"></script>
<script>
(function () {
  if (!window.ArcadeTouch || !window.ArcadeTouch.isTouchDevice()) return;

  /* Radians per pixel dragged. The engine uses 0.0022 for a mouse; a thumb
     travels far less distance than a mouse does for the same intent, so this is
     most of a screen width for a ninety degree turn. */
  var LOOK = 0.0040;
  /* Below this the stick is a wobble, not a direction. */
  var WALK_AT = 0.28;
  /* The Walker has no analogue input — `_updateInput` reads binary keys and
     normalises them — so pace comes from how far the stick is pushed instead:
     past this it also holds Shift, which is the engine's own jog. That gets
     two speeds out of a control the engine thinks is a keyboard. */
  var JOG_AT = 0.82;

  function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

  function start(game) {
    var walker = game.walker;

    /* The canvas asks for pointer lock on every click, and a tap is a click.
       On a phone that request either fails or, worse, succeeds and captures a
       pointer there is no cursor for. Shadowing the method on this element
       leaves the prototype — and every other page — alone. */
    if (game.canvas) game.canvas.requestPointerLock = function () {};

    var touch = window.ArcadeTouch.mount({
      buttons: [
        { id: 'jump', label: 'Jump', size: 'lg' },
      ],
      onLook: function (dx, dy) {
        walker.yaw -= dx * LOOK;
        walker.pitch = clamp(walker.pitch - dy * LOOK, -1.35, 1.35);
      },
      onButton: function (id, down) {
        /* `jump()` queues one hop and the walker refuses to repeat it while
           held, so this is press-only by design — there is no key to release. */
        if (id === 'jump' && down) walker.jump();
      },
    });
    if (!touch) return;

    var k = walker.keys;
    (function frame() {
      requestAnimationFrame(frame);
      var x = touch.move.x, y = touch.move.y;
      var mag = Math.hypot(x, y);
      if (mag < WALK_AT) {
        k.KeyW = k.KeyS = k.KeyA = k.KeyD = k.ShiftLeft = false;
        return;
      }
      /* Eight-way, because that is the shape of the input the engine has. The
         angle is taken from the raw vector rather than from which axis is
         larger, so a diagonal push gives a diagonal walk instead of snapping
         to whichever cardinal happened to win. */
      k.KeyW = y < -0.38;
      k.KeyS = y > 0.38;
      k.KeyA = x < -0.38;
      k.KeyD = x > 0.38;
      k.ShiftLeft = mag > JOG_AT;
    })();

    /* The Escape panel disables nothing in the engine, but a stick drawn over
       an open menu is still an invitation to press something that will not
       answer. */
    var esc = document.getElementById('esc');
    if (esc && window.MutationObserver) {
      new MutationObserver(function () {
        touch.setVisible(esc.getAttribute('data-open') !== '1');
      }).observe(esc, { attributes: true, attributeFilter: ['data-open'] });
    }
  }

  /* `window.__game` is assigned at the end of the module, after a bake that can
     run tens of seconds. Same poll the readiness bridge above uses, and it
     stops either way so a game that never boots does not leave a timer behind. */
  var tries = 0;
  var poll = setInterval(function () {
    if (window.__game && window.__game.walker) {
      clearInterval(poll);
      start(window.__game);
    } else if (++tries > 1200) {
      clearInterval(poll);
    }
  }, 250);
})();
</script>

<script type="module" src="./src/main.js"></script>
</body>
</html>
