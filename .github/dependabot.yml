version: 2

# Dependabot raises alerts on this repo but, until this file existed, had no
# instructions for fixing them — and automated security fixes are switched off
# at the repo level — so ~67 advisories accumulated with zero fix PRs.
#
# This file exists to GROUP those security PRs, not to start a weekly
# dependency treadmill: `open-pull-requests-limit: 0` switches off routine
# version-update PRs while leaving security updates (and the grouping below)
# fully active.
#
# Production and hosted CI use pnpm 9.15.9 with a frozen pnpm-lock.yaml.
# package-lock.json remains for the security-resolution workflow and the
# managed frontend integration. Any dependency edit must reconcile both locks;
# the production workflow never silently repairs the pnpm lock at install time.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # 0 = no routine version-update PRs. Security updates are unaffected.
    open-pull-requests-limit: 0
    groups:
      # One PR per batch of advisories rather than one per CVE — each one
      # otherwise regenerates every lockfile above.
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - patch
          - minor
    ignore:
      # Majors change behaviour and need their own tested PR. react-router 6→7
      # is the live example: it carries a real open-redirect fix, but v7 is a
      # breaking upgrade and must not land as an unattended bump.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
