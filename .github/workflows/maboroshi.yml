name: Maboroshi
on:
  pull_request:
    paths:
      - 'services/maboroshi/**'
      - 'supabase/functions/maboroshi-provider/**'
      - '.github/workflows/maboroshi.yml'
  workflow_dispatch:
jobs:
  workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/maboroshi/requirements.txt httpx==0.28.1
      - name: Verify private hosted workflow and source audio
        working-directory: services/maboroshi
        run: |
          python -m unittest discover -s tests
          python test_composite.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check services/maboroshi/static/studio.js
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test supabase/functions/maboroshi-provider/handler_test.ts
