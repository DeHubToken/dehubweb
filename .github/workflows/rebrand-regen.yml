name: Rebrand regenerate

on:
  push:
    branches: [rebrand-riftn-web]
    paths: ['.github/workflows/rebrand-regen.yml']

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebrand-riftn-web
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-developer-docs-content.mjs
      - run: node scripts/generate-blog-manifest.mjs
      - run: node scripts/build-seo-i18n.mjs
      - run: |
          git rm -q .github/workflows/rebrand-regen.yml
          git config user.name maldoteth
          git config user.email dev@dehub.io
          git add -A public src scripts .github
          git commit -m "Regenerate crawler copy and locale assets"
          git push origin HEAD:rebrand-riftn-web
