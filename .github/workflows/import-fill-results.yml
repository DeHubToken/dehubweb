name: Import fill results

# Temporary: copies the locale files from an i18n fan-out run whose final job
# could not open its PR onto a scratch branch, so they can be merged by hand.

on:
  push:
    branches: [claude/eager-volta-9czx5g]
    paths: ['.github/workflows/import-fill-results.yml']

permissions:
  contents: write
  actions: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: locale-ar
          path: fill
          run-id: 40261509730
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: locale-es
          path: fill
          run-id: 40261509730
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: locale-fr
          path: fill
          run-id: 40261509730
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: locale-nl
          path: fill
          run-id: 40261509730
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: locale-bg
          path: fill
          run-id: 40261509730
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: locale-acw
          path: fill
          run-id: 40261509730
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: locale-ajp
          path: fill
          run-id: 40261509730
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: locale-ary
          path: fill
          run-id: 40261509730
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: locale-arz
          path: fill
          run-id: 40261509730
          github-token: ${{ github.token }}
      - name: Push the files to a scratch branch
        run: |
          ls fill | wc -l
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan fill-results-88b
          git rm -rq --cached .
          git add -f fill
          git commit -qm "Locale files from i18n fan-out run 40261509730"
          git push -f origin fill-results-88b
