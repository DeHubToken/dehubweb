name: Provider usage schema
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20261006132400_provider_usage_daily.sql'
      - 'scripts/provider-usage-schema.test.sql'
      - '.github/workflows/provider-usage.yml'
jobs:
  schema:
    name: Provider accounting SQL
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: fixture-only
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration and verify privileges and aggregation
        run: |
          psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role BYPASSRLS;'
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261006132400_provider_usage_daily.sql
          psql -v ON_ERROR_STOP=1 -f scripts/provider-usage-schema.test.sql
