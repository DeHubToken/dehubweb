name: Production performance audit
on:
  workflow_dispatch:
    inputs:
      invalidations:
        description: Include verbose CSS invalidation causes (large trace files)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare hosted browser
        run: |
          npm install --prefix "$RUNNER_TEMP/performance-browser" --no-save --no-package-lock --ignore-scripts playwright@1.64.0
          "$RUNNER_TEMP/performance-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Measure production cold load, warm load, scroll and navigation
        env:
          PERFORMANCE_BROWSER_ROOT: ${{ runner.temp }}/performance-browser
          PERFORMANCE_INVALIDATIONS: ${{ inputs.invalidations && '1' || '0' }}
        run: node tests/performance-production.mjs
      - name: Check delayed media frame stability through scroll-back
        if: always()
        env:
          PERFORMANCE_BROWSER_ROOT: ${{ runner.temp }}/performance-browser
        run: node tests/feed-frame-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-performance
          path: performance-results/
          retention-days: 14
