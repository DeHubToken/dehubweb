name: Bounty integrity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  database:
    name: Bounty database rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: test
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/work-integrity-fixture.sql -f supabase/migrations/20261004100000_work_integrity.sql -f supabase/tests/work-integrity.sql
