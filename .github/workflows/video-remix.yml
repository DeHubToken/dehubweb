name: Video remix recording
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/editor/remixStudioHtml.ts'
      - 'src/pages/VideoRemix.tsx'
      - 'tests/video-remix-browser.mjs'
      - 'src/components/app/cards/RemixMenuItems.tsx'
      - '.github/workflows/video-remix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recording:
    name: Real camera compositing and recording
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install hosted browser and media inspection tools
        run: |
          npm install --prefix "$RUNNER_TEMP/remix-browser" --no-save --no-package-lock --ignore-scripts playwright@1.64.0
          "$RUNNER_TEMP/remix-browser/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Record every mode and duet layout and inspect encoded output
        env:
          REMIX_BROWSER_ROOT: ${{ runner.temp }}/remix-browser
        run: node --experimental-strip-types tests/video-remix-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-remix-recordings
          path: |
            video-remix-browser-results/*.json
            video-remix-browser-results/*.txt
            video-remix-browser-results/*.png
            video-remix-browser-results/*.webm
            video-remix-browser-results/*.mp4
          if-no-files-found: ignore
          retention-days: 7
