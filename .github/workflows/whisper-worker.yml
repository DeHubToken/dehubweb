name: Whisper worker
on:
  pull_request:
    paths:
      - 'services/whisper/**'
      - '.github/workflows/whisper-worker.yml'
  push:
    branches: [main]
    paths:
      - 'services/whisper/**'
      - '.github/workflows/whisper-worker.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy requests
      - run: python -m unittest discover -s services/whisper -p 'test_*.py'
  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - tag: cpu
            gpu: '0'
          - tag: gpu
            gpu: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/whisper
          build-args: GPU=${{ matrix.gpu }}
          push: ${{ github.event_name == 'push' }}
          load: ${{ matrix.gpu == '0' }}
          tags: |
            ghcr.io/dehubtoken/dehub-whisper:${{ matrix.tag }}
            ghcr.io/dehubtoken/dehub-whisper:${{ matrix.tag }}-${{ github.sha }}
      - name: Weights load offline and the API answers
        if: matrix.gpu == '0'
        run: |
          docker run --rm ghcr.io/dehubtoken/dehub-whisper:cpu python -c "import numpy as np, engine; a = (np.random.randn(16000 * 5) * 0.01).astype('float32'); print(engine.transcribe(a)); print(engine.diarize(a))"
          docker run -d --name whisper-ci -p 7860:7860 -e WHISPER_WORKER_SECRET=ci ghcr.io/dehubtoken/dehub-whisper:cpu
          for i in $(seq 1 30); do curl -fs localhost:7860/ && exit 0; sleep 2; done
          docker logs whisper-ci; exit 1
