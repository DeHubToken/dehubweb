name: Bind staging.dehub.io to the edge worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bind-route:
    runs-on: ubuntu-latest
    steps:
      - name: Add the workers route
        env:
          CF_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_APITOKEN }}
          CF_ACCOUNT_ID_RAW: ${{ secrets.CLOUDFLARE_ID }}
        run: |
          set -euo pipefail
          # Secret values were stored from a Windows shell and carry stray
          # carriage returns / padding — strip everything non-token.
          CF_API_TOKEN="$(printf '%s' "$CF_API_TOKEN_RAW" | tr -d '[:space:]\r'"'"'"')"
          echo "token length: ${#CF_API_TOKEN}"
          # Shape diagnostics without ever printing the secret itself.
          case "$CF_API_TOKEN" in
            Bearer*) echo "note: value carries a literal 'Bearer' prefix"; CF_API_TOKEN="${CF_API_TOKEN#Bearer }" ;;
          esac
          if printf '%s' "$CF_API_TOKEN" | grep -qE '^[A-Za-z0-9_-]+$'; then
            echo "note: value is plain alnum"
          else
            echo "note: value contains non-token characters"
            CF_API_TOKEN="$(printf '%s' "$CF_API_TOKEN" | tr -d '"'"'"'')"
            echo "after quote-strip length: ${#CF_API_TOKEN}"
          fi
          if [ ${#CF_API_TOKEN} -ne 40 ]; then
            echo "WARN: expected a 40-char API token, got ${#CF_API_TOKEN}"
          fi
          # Find the zone from the token's own grants rather than trusting the
          # stored id — the CLOUDFLARE_ID secret does not parse as a CF id.
          RESP=$(curl -sS -w '\n%{http_code}' \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?per_page=50")
          CODE=$(printf '%s' "$RESP" | tail -n1)
          BODY=$(printf '%s' "$RESP" | sed '$d')
          echo "zones api http $CODE"
          ZONE=$(printf '%s' "$BODY" | jq -r '.result[]? | select(.name == "dehub.io") | .id' | head -1)
          if [ -z "$ZONE" ]; then
            echo "ERROR: dehub.io zone not visible to this token — body follows"
            printf '%s\n' "$BODY" | head -c 800
            exit 1
          fi
          echo "zone id: $ZONE"
          echo '--- create route ---'
          curl -sSf -X POST \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"pattern":"staging.dehub.io/*","script":"dehub-migration"}' \
            "https://api.cloudflare.com/client/v4/zones/$ZONE/workers/routes"
          echo
          echo '--- routes now on the zone ---'
          curl -sSf -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE/workers/routes"
