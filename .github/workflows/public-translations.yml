name: Public page translations

on:
  workflow_dispatch:
  push:
    branches: [fix/priority-languages-seo-20261011]
    paths: [scripts/public-translation-request.json]

permissions:
  contents: read

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        locale: [ar, es, fr, nl, tr]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Translate public page copy
        env:
          TRANSLATION_REQUEST: scripts/public-translation-request.json
          TRANSLATION_LOCALE: ${{ matrix.locale }}
        run: node scripts/translate-priority-locales.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-translations-${{ matrix.locale }}
          path: translation-output/
          retention-days: 14
