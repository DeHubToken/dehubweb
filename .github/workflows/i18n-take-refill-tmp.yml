name: take refill (branch only)

on:
  push:
    branches: [i18n-prune-garbled]

permissions:
  contents: write
  actions: read

jobs:
  take:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: locale-*
          merge-multiple: true
          path: /tmp/refill
          run-id: 36578118856
          github-token: ${{ github.token }}
      - name: Take the refill, keeping values the refill's prune step removed
        run: |
          cat > /tmp/take.mjs <<'EOF'
          import fs from 'node:fs';
          const dir = 'src/i18n/locales';
          const en = JSON.parse(fs.readFileSync(`${dir}/en.json`, 'utf8'));
          const flat = (o, p = '', out = new Map()) => {
            for (const [k, v] of Object.entries(o)) {
              const key = p ? `${p}.${k}` : k;
              if (v && typeof v === 'object' && !Array.isArray(v)) flat(v, key, out); else out.set(key, v);
            }
            return out;
          };
          const set = (root, key, val) => {
            const parts = key.split('.');
            let n = root;
            for (const p of parts.slice(0, -1)) { if (!n[p] || typeof n[p] !== 'object') n[p] = {}; n = n[p]; }
            n[parts.at(-1)] = val;
          };
          function reorderLike(template, filled) {
            if (Array.isArray(template) || typeof template !== 'object' || template === null) return filled;
            const out = {};
            for (const k of Object.keys(template)) { if (!(k in filled)) continue; out[k] = reorderLike(template[k], filled[k]); }
            for (const k of Object.keys(filled)) if (!(k in out)) out[k] = filled[k];
            return out;
          }
          let back = 0;
          for (const f of fs.readdirSync('/tmp/refill').filter((f) => f.endsWith('.json'))) {
            const pre = JSON.parse(fs.readFileSync(`${dir}/${f}`, 'utf8'));
            const out = JSON.parse(fs.readFileSync(`/tmp/refill/${f}`, 'utf8'));
            const outFlat = flat(out);
            const lost = [...flat(pre)].filter(([k]) => !outFlat.has(k));
            for (const [k, v] of lost) set(out, k, v);
            fs.writeFileSync(`${dir}/${f}`, JSON.stringify(reorderLike(en, out), null, 2) + '\n');
            if (lost.length) console.log(`${f}: put back ${lost.map(([k]) => k).join(', ')}`);
            back += lost.length;
          }
          console.log(`put back ${back}`);
          EOF
          node /tmp/take.mjs
      - run: node scripts/i18n-fanout.mjs --emit-fallback-list
      - run: node scripts/build-seo-i18n.mjs
      - run: node scripts/i18n-fanout.mjs --prune --garbled --dry-run | grep '^  ' || echo "no garbled app values left"
      - run: |
          git config user.name maldoteth
          git config user.email dev@dehub.io
          git add src/i18n/locales/*.json src/i18n/widget-fallback-locales.ts public/seo-i18n.json
          git commit -q -m "Refill the deleted app strings"
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          merge-multiple: true
          path: src/i18n
          run-id: 36578123662
          github-token: ${{ github.token }}
      - run: node scripts/docs-i18n-fill.mjs --prune-garbled --dry-run | grep '^  ' || echo "no garbled docs values left"
      - run: |
          git status --short | grep -v '^ M src/i18n/[a-z_]*\.ts$' || true
          git add src/i18n/*.ts
          git commit -q -m "Refill the deleted docs strings"
          git show --shortstat HEAD~1 | tail -1
          git show --shortstat HEAD | tail -1
          git push origin HEAD:i18n-prune-garbled
