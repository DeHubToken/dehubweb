name: prune garbled (branch only)

on:
  push:
    branches: [i18n-prune-garbled]

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/docs-i18n-fill.mjs --prune-garbled
      - run: node scripts/docs-i18n-fill.mjs --prune-garbled --dry-run | grep '^  ' || echo "no garbled docs values left"
      - run: |
          git config user.name maldoteth
          git config user.email dev@dehub.io
          git add src/i18n/*.ts
          git commit -q -m "Delete two garbled docs values main brought in"
          git push origin HEAD:i18n-prune-garbled
