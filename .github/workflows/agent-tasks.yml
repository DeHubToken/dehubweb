name: Agent tasks
on:
  pull_request:
    paths:
      - 'supabase/functions/dehub-mcp/**'
      - 'supabase/migrations/20261011210000_private_agent_tasks.sql'
      - 'tests/sql/agent-tasks.sql'
      - '.github/workflows/agent-tasks.yml'
jobs:
  edge:
    name: Agent task validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/dehub-mcp/deno.json supabase/functions/dehub-mcp/index.ts
      - run: deno test --allow-env --config supabase/functions/dehub-mcp/deno.json supabase/functions/dehub-mcp/task-plan.test.ts supabase/functions/dehub-mcp/tasks.test.ts supabase/functions/dehub-mcp/post-views.test.ts
  database:
    name: Agent task permissions and claims
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: agent-test
          POSTGRES_DB: agent_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: agent-test
      PGDATABASE: agent_test
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f tests/sql/agent-tasks.sql
