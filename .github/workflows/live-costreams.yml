name: Live co-streams
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261026090000_live_costreams.sql'
      - 'tests/sql/live-costreams*.sql'
      - '.github/workflows/live-costreams.yml'
  workflow_dispatch:
jobs:
  database:
    name: Co-stream seats, battles and matchmaking
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: costream-test
          POSTGRES_DB: costream_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: costream-test
      PGDATABASE: costream_test
    steps:
      - uses: actions/checkout@v4
      - run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/live-costreams-bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261026090000_live_costreams.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/live-costreams.sql
