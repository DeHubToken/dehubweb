name: Community existing posts
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261011160000_community_existing_posts.sql'
      - 'tests/sql/community-posts*.sql'
      - '.github/workflows/community-posts.yml'
  workflow_dispatch:
jobs:
  database:
    name: Community post permissions and identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_PASSWORD: community-test
          POSTGRES_DB: community_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: community-test
      PGDATABASE: community_test
    steps:
      - uses: actions/checkout@v4
      - run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/community-posts-bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261011160000_community_existing_posts.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/community-posts.sql
