name: Public HTML text translations

on:
  push:
    branches: [fix/priority-languages-seo-20261011]
    paths: [scripts/public-html-node-request.json]

permissions:
  contents: read

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        locale: [ar, es, fr, nl, tr]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Translate embedded HTML text
        env:
          TRANSLATION_REQUEST: scripts/public-html-node-request.json
          TRANSLATION_LOCALE: ${{ matrix.locale }}
        run: node scripts/translate-priority-locales.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-html-nodes-${{ matrix.locale }}
          path: translation-output/
          retention-days: 14
