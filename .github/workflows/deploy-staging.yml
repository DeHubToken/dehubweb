# Builds the `staging` branch and publishes it to https://staging.dehub.io.
#
# Production is never touched by this workflow: the deploy step pins
# `-c wrangler.staging.jsonc`, which targets the `dehub-staging` worker. The
# production worker (`dehub-migration`, wrangler.jsonc) has its own routes and
# is only ever deployed from its own config.
name: Deploy staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

# A push landing mid-build supersedes it — staging should track the tip of the
# branch, not finish a queue of stale builds.
concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # pnpm, not npm: .npmrc pins node-linker=hoisted to keep the phantom
      # transitive imports in the web3 stack resolvable, and the repo's
      # lockfile is pnpm-lock.yaml.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Not --frozen-lockfile (pnpm's CI default): pnpm-lock.yaml trails
      # package.json, which declares wrangler, hash-wasm and
      # @testing-library/dom without them being locked — added via npm, so
      # package-lock.json moved and this one didn't. A frozen install aborts
      # on that. The drift is purely additive, so resolving the three at
      # install time is safe for staging. Refresh the lockfile on main and
      # this should go back to frozen.
      - run: pnpm install --no-frozen-lockfile

      # No build secrets: .env is committed on purpose and holds only
      # publishable VITE_* client keys (see the note atop .gitignore).
      - run: pnpm run build

      # The account ID is derived rather than stored. A scoped API token can't
      # call /accounts (that needs Account Settings: Read), so wrangler can't
      # infer it — but the token must already reach the dehub.io zone to bind
      # the staging route, and a zone record names the account that owns it.
      # One lookup turns the token into the account ID, so there is no second
      # secret to keep in sync or paste correctly.
      - name: Resolve Cloudflare account ID
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_APITOKEN }}
        run: |
          RESP=$(curl -s -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=dehub.io")
          ACCOUNT=$(printf '%s' "$RESP" | jq -r '.result[0].account.id // empty')
          if [ -z "$ACCOUNT" ]; then
            echo "Could not resolve the account from the dehub.io zone."
            echo "The token likely lacks zone access — it needs Workers Routes:"
            echo "Edit on dehub.io, which is required to bind the route anyway."
            printf '%s' "$RESP" | jq -r '.errors // empty'
            exit 1
          fi
          echo "Resolved account ${ACCOUNT:0:6}… from the dehub.io zone"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT" >> "$GITHUB_ENV"

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_APITOKEN }}
          command: deploy -c wrangler.staging.jsonc
