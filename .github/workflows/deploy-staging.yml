# Builds the `staging` branch and publishes it to https://staging.dehub.io.
#
# Production is never touched by this workflow: the deploy step pins
# `-c wrangler.staging.jsonc`, which targets the `dehub-staging` worker. The
# production worker (`dehub-migration`, wrangler.jsonc) has its own routes and
# is only ever deployed from its own config.
name: Deploy staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

# A push landing mid-build supersedes it — staging should track the tip of the
# branch, not finish a queue of stale builds.
concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # pnpm, not npm: .npmrc pins node-linker=hoisted to keep the phantom
      # transitive imports in the web3 stack resolvable, and the repo's
      # lockfile is pnpm-lock.yaml.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Not --frozen-lockfile (pnpm's CI default): pnpm-lock.yaml trails
      # package.json, which declares wrangler, hash-wasm and
      # @testing-library/dom without them being locked — added via npm, so
      # package-lock.json moved and this one didn't. A frozen install aborts
      # on that. The drift is purely additive, so resolving the three at
      # install time is safe for staging. Refresh the lockfile on main and
      # this should go back to frozen.
      - run: pnpm install --no-frozen-lockfile

      # No build secrets: .env is committed on purpose and holds only
      # publishable VITE_* client keys (see the note atop .gitignore).
      - run: pnpm run build

      # Two things happen here, both to keep credentials out of the failure
      # modes that cost the most time to diagnose.
      #
      # 1. The token is trimmed. Pasting into the secrets UI carries a
      #    trailing newline when the copied text included a line break, and
      #    the API rejects that as "Invalid format for Authorization header"
      #    (6111) — which reads as a permissions problem and isn't one. The
      #    trimmed value is re-masked before it enters the environment, since
      #    the runner only auto-masks the literal stored secret.
      #
      # 2. The account ID is derived, not stored. A scoped token can't call
      #    /accounts (that needs Account Settings: Read), so wrangler can't
      #    infer it — but the token already reaches the dehub.io zone to bind
      #    the route, and a zone record names the account that owns it. That
      #    leaves one secret to get right instead of two.
      - name: Prepare Cloudflare credentials
        env:
          CF_TOKEN_RAW: ${{ secrets.CLOUDFLARE_APITOKEN }}
        run: |
          TOKEN=$(printf '%s' "$CF_TOKEN_RAW" | tr -d '[:space:]' | tr -d '"'"'")
          echo "::add-mask::$TOKEN"
          if [ -z "$TOKEN" ]; then
            echo "CLOUDFLARE_APITOKEN is empty after trimming."
            exit 1
          fi

          VERIFY=$(curl -s -H "Authorization: Bearer $TOKEN" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify")
          if [ "$(printf '%s' "$VERIFY" | jq -r '.success')" != "true" ]; then
            echo "The API token was rejected by Cloudflare:"
            printf '%s' "$VERIFY" | jq -r '.errors'
            # Shape-only report on the stored value: a Cloudflare token is
            # ~40 characters of [A-Za-z0-9_-]. Length and the offending byte
            # codes say what was pasted (a URL, an email, a smart quote from
            # a styled UI) without echoing the value itself.
            echo "--- stored value, shape only ---"
            echo "length: $(printf '%s' "$TOKEN" | wc -c)"
            BAD=$(printf '%s' "$TOKEN" | tr -d 'A-Za-z0-9_-' | od -An -tx1 | tr -s ' ')
            if [ -n "$(printf '%s' "$BAD" | tr -d ' ')" ]; then
              echo "bytes outside [A-Za-z0-9_-]:$BAD"
            else
              echo "character set is valid; the token is well-formed but wrong"
            fi
            echo "Create a token with Workers Scripts: Edit, plus Workers"
            echo "Routes: Edit on the dehub.io zone, and store it as"
            echo "CLOUDFLARE_APITOKEN."
            exit 1
          fi
          echo "Token verified: $(printf '%s' "$VERIFY" | jq -r '.result.status')"

          ZONE=$(curl -s -H "Authorization: Bearer $TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=dehub.io")
          ACCOUNT=$(printf '%s' "$ZONE" | jq -r '.result[0].account.id // empty')
          if [ -z "$ACCOUNT" ]; then
            echo "Token is valid but cannot see the dehub.io zone, so the"
            echo "account ID could not be derived. Add Workers Routes: Edit"
            echo "on dehub.io — binding the staging route needs it regardless."
            printf '%s' "$ZONE" | jq -r '.errors // empty'
            exit 1
          fi
          echo "Resolved account ${ACCOUNT:0:6}… from the dehub.io zone"

          echo "CF_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT" >> "$GITHUB_ENV"

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_TOKEN }}
          command: deploy -c wrangler.staging.jsonc
