name: Creator avatar input and pricing
on:
  pull_request:
    paths: ['src/lib/creator/avatar*', 'src/components/app/video/AvatarVideoPaywall*', 'tests/avatar-storage.mjs', 'supabase/functions/_shared/creator-avatar*', 'supabase/functions/_shared/speech-audio.ts', 'supabase/functions/ai-quote/**', 'supabase/functions/generate-video/**', '.github/workflows/creator-avatar.yml']
jobs:
  avatar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: deno test --node-modules-dir=none supabase/functions/_shared/creator-avatar.test.ts
      - run: deno check --node-modules-dir=none supabase/functions/ai-quote/index.ts supabase/functions/generate-video/index.ts
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Verify paid input storage upgrades and isolation
        env:
          AVATAR_TEST_DEPS: ${{ runner.temp }}/avatar-test-deps
        run: |
          npm install --prefix "$AVATAR_TEST_DEPS" --no-package-lock --ignore-scripts fake-indexeddb@6.0.0
          node --experimental-strip-types --test tests/avatar-storage.mjs
