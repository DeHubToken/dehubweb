name: Public page translation remainder

on:
  push:
    branches: [fix/priority-languages-seo-20261011]
    paths: [scripts/public-remainder-requests/**]

permissions:
  contents: read

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        locale: [ar, es, fr, nl, tr]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Translate remaining page copy
        env:
          TRANSLATION_REQUEST: scripts/public-remainder-requests/${{ matrix.locale }}-${{ matrix.shard }}.json
          TRANSLATION_LOCALE: ${{ matrix.locale }}
        run: node scripts/translate-priority-locales.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-remainder-${{ matrix.locale }}-${{ matrix.shard }}
          path: translation-output/
          retention-days: 14
