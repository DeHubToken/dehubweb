name: Staging preview

on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-preview
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'staging-preview'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: https://staging.dehub.io
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - name: Deploy staging
        run: |
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            const account = process.env.CLOUDFLARE_ACCOUNT_ID.trim();
            const token = process.env.CLOUDFLARE_API_TOKEN.trim();
            execFileSync(process.execPath, ["node_modules/wrangler/bin/wrangler.js", "deploy", "--config", "wrangler.staging.jsonc"], {
              stdio: "inherit",
              env: { ...process.env, CLOUDFLARE_ACCOUNT_ID: account, CLOUDFLARE_API_TOKEN: token },
            });
          '
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_APITOKEN }}
          # Account used by the existing production Workers build integration.
          CLOUDFLARE_ACCOUNT_ID: 66a904429763c3c58f371813c79d6b44
