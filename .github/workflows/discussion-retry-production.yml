name: Discussion retry production verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated browser
        run: npm install --prefix "$RUNNER_TEMP/discussion-browser" --no-save --no-package-lock --ignore-scripts playwright@1.64.0
      - name: Verify production comment failure and recovery
        env:
          GOVERNANCE_BROWSER_ROOT: ${{ runner.temp }}/discussion-browser
        run: node tests/discussion-retry-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discussion-retry-production
          path: discussion-retry-results/
          retention-days: 14
