name: Configure bounty receipt verifier
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set the Worker receipt signing secret
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_APITOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ID }}
          RECEIPT_KEY: ${{ secrets.WORK_RECEIPT_SIGNING_KEY }}
        run: |
          node --input-type=module <<'JS'
          for (const name of ['CF_TOKEN','CF_ACCOUNT','RECEIPT_KEY']) if (!process.env[name]) throw new Error('Missing '+name);
          const response = await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CF_ACCOUNT+'/workers/scripts/dehub-migration/secrets', {
            method:'PUT', headers:{Authorization:'Bearer '+process.env.CF_TOKEN,'Content-Type':'application/json'},
            body:JSON.stringify({name:'WORK_RECEIPT_SIGNING_KEY',type:'secret_text',text:process.env.RECEIPT_KEY})
          });
          const result=await response.json();
          if(!response.ok || !result.success) throw new Error('Worker secret configuration failed: '+response.status+' '+JSON.stringify(result.errors));
          console.log('Bounty receipt verifier configured.');
          JS
