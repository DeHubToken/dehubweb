name: Configure bounty receipt verifier
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set the production and staging receipt signing secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_APITOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ID }}
          RECEIPT_KEY: ${{ secrets.WORK_RECEIPT_SIGNING_KEY }}
        run: |
          node --input-type=module <<'JS'
          for (const name of ['CF_TOKEN','CF_ACCOUNT','RECEIPT_KEY']) if (!process.env[name]?.trim()) throw new Error('Missing '+name);
          const account = process.env.CF_ACCOUNT.trim();
          const key = process.env.RECEIPT_KEY.trim();
          if (!/^[a-f0-9]{32}$/i.test(account)) throw new Error('CLOUDFLARE_ID must be the 32-character account ID.');
          if (!/^[a-f0-9]{64}$/i.test(key)) throw new Error('WORK_RECEIPT_SIGNING_KEY must be a 32-byte hex key.');
          for (const worker of ['dehub-migration', 'dehub-staging']) {
            const response = await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/'+worker+'/secrets', {
              method:'PUT', headers:{Authorization:'Bearer '+process.env.CF_TOKEN.trim(),'Content-Type':'application/json'},
              body:JSON.stringify({name:'WORK_RECEIPT_SIGNING_KEY',type:'secret_text',text:key})
            });
            const result=await response.json();
            if(!response.ok || !result.success) throw new Error(worker+' secret configuration failed: '+response.status+' '+JSON.stringify(result.errors));
            console.log(worker+' bounty receipt verifier configured.');
          }
          JS
