name: docs i18n fill

# Fills the docs/marketing bundles (src/i18n/<lang>.ts, read by useLanguage())
# that are behind en.ts and opens one PR with the result. The app strings have
# their own workflow, i18n-fanout.yml; this runs the same guarded fill over the
# docs bundles through scripts/docs-i18n-fill.mjs.
#
# One job per locale, up to 20 side by side: a bundle takes one to four hours,
# so a job filling several in a row hit the time limit after two or three.
# Each job only writes its own bundle; a final job gathers them into one PR.
# No secret is needed — the translate function is called with the publishable
# key the browser bundle already ships.

on:
  workflow_dispatch:
    inputs:
      locales:
        description: 'Comma-separated locale codes (blank = the furthest behind)'
        required: false
        default: ''
      count:
        description: 'How many locales to fill when none are named'
        required: false
        default: '20'
      keys:
        description: 'Max keys per locale in one run (blank = all missing)'
        required: false
        default: ''
      paths:
        description: 'Comma-separated en.ts keys or arrays to fill and nothing else (blank = every missing key)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      locales: ${{ steps.pick.outputs.locales }}
    steps:
      - uses: actions/checkout@v4
      # 24 imports the .ts bundles directly; 20 cannot.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Report the gap before
        run: node scripts/docs-i18n-fill.mjs --check | head -30
      - id: pick
        run: |
          if [ -n "${{ inputs.locales }}" ]; then
            LIST="${{ inputs.locales }}"
          else
            LIST=$(node scripts/docs-i18n-fill.mjs --check | awk 'NF >= 2 && $(NF-1) == "missing" && $NF+0 > 0 {print $1}' | head -${{ inputs.count }} | paste -sd, -)
          fi
          echo "locales=$(node -e 'console.log(JSON.stringify(process.argv[1].split(",").map(s=>s.trim()).filter(Boolean)))' "$LIST")" >> "$GITHUB_OUTPUT"

  fill:
    needs: plan
    if: needs.plan.outputs.locales != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        locale: ${{ fromJSON(needs.plan.outputs.locales) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fill
        env:
          PATHS: ${{ inputs.paths }}
        run: |
          ARGS="--locales ${{ matrix.locale }}"
          if [ -n "${{ inputs.keys }}" ]; then ARGS="$ARGS --keys ${{ inputs.keys }}"; fi
          node scripts/docs-i18n-fill.mjs $ARGS ${PATHS:+--paths "$PATHS"}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.locale }}
          path: src/i18n/${{ matrix.locale }}.ts

  pr:
    needs: fill
    # always(): a bundle that timed out loses only itself, not the others.
    if: always() && needs.fill.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          merge-multiple: true
          path: src/i18n

      - name: Report the gap after
        run: node scripts/docs-i18n-fill.mjs --check | head -30

      - name: Open a pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: docs-i18n-fill-${{ github.run_number }}
          commit-message: 'Translate the docs pages into more locales'
          title: 'Translate the docs pages into more locales'
          body: |
            Filled by `scripts/docs-i18n-fill.mjs`, one job per locale.

            **Intent** — the docs and marketing pages rendered mostly in English
            outside a few locales; this fills the missing strings.

            **Constraints** — same guards as the app fill: existing values are
            never overwritten, broken placeholders, English echoes and
            wrong-script answers are dropped. Each file is re-imported after the
            write and left untouched if it does not match.

            **Result** — see the before/after gap in the run log.
          add-paths: |
            src/i18n/*.ts
