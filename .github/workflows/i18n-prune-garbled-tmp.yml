name: prune garbled (branch only)

on:
  push:
    branches: [i18n-prune-garbled]

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/docs-i18n-fill.mjs --prune-garbled --locales apd,bho,ctg,fa,hne,ko,lt,mn,ms,ne,no,pcm,skr | tee prune-docs.log
      - uses: actions/upload-artifact@v4
        with:
          name: prune-logs
          path: prune-*.log
      - run: |
          git config user.name maldoteth
          git config user.email dev@dehub.io
          git add src/i18n/*.ts
          git commit -q -m "Delete the garbled docs values main brought back"
          git push origin HEAD:i18n-prune-garbled
