name: Dub worker
on:
  pull_request:
    paths:
      - 'services/auto-dub/**'
      - '.github/workflows/dub-worker.yml'
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy soundfile requests
      - run: python -m unittest discover -s services/auto-dub -p 'test_*.py'
