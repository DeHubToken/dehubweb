# Standby copy of riftn.com (ops/STANDBY.md). Nobody reaches this while
# riftn.com points at Cloudflare. The "Switch riftn.com to backup" workflow
# points riftn.com here when Cloudflare is down. Reuses the maps and the
# api_backend upstream already defined by 03-direct-web.conf / dehub.io.conf.
server {
    listen 443 ssl http2;
    server_name riftn.com www.riftn.com;
    ssl_certificate /etc/letsencrypt/live/riftn-standby/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/riftn-standby/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 100M;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-DeHub-Standby "1" always;

    root /var/www/riftn-standby/current;
    index index.html;

    if ($host = www.riftn.com) { return 301 https://riftn.com$request_uri; }

    location ^~ /.well-known/acme-challenge/ { root /var/www/dehub-acme; }

    location ^~ /_api/api/ {
        rewrite ^/_api(/api/.*)$ $1 break;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host api.dehub.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_cache off;
    }

    location ^~ /_sb/ {
        if ($dehub_sb_path = "") { return 400; }
        if ($dehub_sb_path ~* "(%2e|%2f|%5c|\x5c|/\.\.?(/|$))") { return 400; }
        resolver 1.1.1.1 1.0.0.1 valid=60s;
        resolver_timeout 5s;
        set $dehub_supabase aigxuutjaqsywioxjefr.supabase.co;
        proxy_pass https://$dehub_supabase$dehub_sb_path$is_args$args;
        proxy_ssl_server_name on;
        proxy_ssl_name aigxuutjaqsywioxjefr.supabase.co;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_http_version 1.1;
        proxy_set_header Host aigxuutjaqsywioxjefr.supabase.co;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dehub_sb_connection;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header CF-Connecting-IP "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_redirect off;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Worker-only endpoints (stats, oembed, editor rooms) keep trying the
    # Worker. They fail while Cloudflare is down, and the app carries on.
    location ^~ /api/ {
        resolver 1.1.1.1 1.0.0.1 valid=60s;
        resolver_timeout 5s;
        set $dehub_worker origin.dehub.io;
        proxy_pass https://$dehub_worker$request_uri;
        proxy_ssl_server_name on;
        proxy_ssl_name origin.dehub.io;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_http_version 1.1;
        proxy_set_header Host origin.dehub.io;
        proxy_set_header X-DeHub-Public-Host riftn.com;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dehub_sb_connection;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # add_header in a location drops the server-level ones, so the marker the
    # switch checks for is repeated where it is read.
    location = /version.json {
        add_header Cache-Control "no-store" always;
        add_header X-DeHub-Standby "1" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location ~ ^/\.well-known/(apple-app-site-association|assetlinks\.json|webauthn)$ {
        default_type application/json;
        try_files $uri =404;
    }
    location = /apple-app-site-association {
        default_type application/json;
        try_files /.well-known/apple-app-site-association =404;
    }

    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-DeHub-Standby "1" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
server {
    listen 80;
    server_name riftn.com www.riftn.com;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/dehub-acme; }
    location / { return 301 https://riftn.com$request_uri; }
}
