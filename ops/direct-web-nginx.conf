# Temporary public entry point. Application releases still deploy to the Worker.
# origin.dehub.io must be attached to dehub-migration before enabling this file.
server {
    listen 443 ssl http2;
    server_name dehub.io;
    ssl_certificate /etc/letsencrypt/live/dehub-direct/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dehub-direct/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 100M;
    server_tokens off;
    # No includeSubDomains: live.dehub.io (media server) and other subdomains
    # are not all known to be HTTPS-only.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Keep same-origin API traffic local and preserve the actual client address.
    location ^~ /_api/api/ {
        rewrite ^/_api(/api/.*)$ $1 break;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host api.dehub.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_cache off;
        # This host speaks HTTP/1.1 and h2 only; do not pass on an h3 offer.
        proxy_hide_header alt-svc;
    }

    location / {
        resolver 1.1.1.1 1.0.0.1 valid=60s;
        resolver_timeout 5s;
        set $dehub_worker origin.dehub.io;
        proxy_pass https://$dehub_worker$request_uri;
        proxy_ssl_server_name on;
        proxy_ssl_name origin.dehub.io;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_http_version 1.1;
        proxy_set_header Host origin.dehub.io;
        proxy_set_header X-DeHub-Public-Host dehub.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_cache off;
        proxy_hide_header alt-svc;
    }
}
server {
    listen 80;
    server_name dehub.io;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/dehub-acme; }
    location / { return 301 https://dehub.io$request_uri; }
}
